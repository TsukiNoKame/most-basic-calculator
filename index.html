<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android-Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Most Basic Calculator</h1>

    <div class="container">
        <input id="display"></input>

        <div id="keys">
            
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>

            <button class="operator" onclick="operatorToDisplay('+')">+</button>
            <button class="operator" onclick="operatorToDisplay('-')">-</button>
            <button onclick="appendToDisplay('0')">0</button>
            
            
            <button class="operator" onclick="operatorToDisplay('*')">*</button>
            <button class="operator" onclick="operatorToDisplay('/')">/</button>
            <button class="operator" onclick="calculate()">=</button>
        </div>

        <div class="extra">
            <button class="operator del" onclick="del()">Delete</button>
            <button class="operator clear" onclick="clean()">Clear</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
